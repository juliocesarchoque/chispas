<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Chispa — Ideas y Features</title>
    <meta
      name="description"
      content="Captura tus ideas sin internet y sincronízalas entre tu teléfono y computadora."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161513" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chispa" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('chispa-theme');
          var isDark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.style.backgroundColor = isDark ? '#161513' : '#F6F4EF';
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', isDark ? '#161513' : '#F6F4EF');
          }
          var schemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (schemeMeta) {
            schemeMeta.setAttribute('content', isDark ? 'dark' : 'light');
          }
          var appleMeta = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]'
          );
          if (appleMeta) {
            appleMeta.setAttribute(
              'content',
              isDark ? 'black-translucent' : 'default'
            );
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
